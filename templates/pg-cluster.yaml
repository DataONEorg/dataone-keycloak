## Create a PostgreSQL cluster using the CloudNative-PG operator
## (https://github.com/cloudnative-pg/cloudnative-pg)
##
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-cnpg
  namespace: {{ .Release.Namespace }}
spec:
  instances: {{ .Values.keycloakx.database.replicas }}
  {{- $img := .Values.keycloakx.database.image | default dict }}
  {{- if $img.catalog }}
    {{- fail "keycloakx.database.image.catalog is not supported by this chart; set keycloakx.database.image.name instead (image catalog support is planned for the dataone-cnpg chart)" }}
  {{- end }}
  imageName: {{ required "keycloakx.database.image.name must be set, so the operator's default image is never used" $img.name | quote }}
  primaryUpdateStrategy: {{ .Values.keycloakx.database.primaryUpdateStrategy | default "unsupervised" }}
  primaryUpdateMethod: {{ .Values.keycloakx.database.primaryUpdateMethod | default "switchover" }}
  {{- with .Values.keycloakx.database.smartShutdownTimeout }}
  smartShutdownTimeout: {{ . }}
  {{- end }}
  bootstrap:
    initdb:
      database: {{ .Values.keycloakx.database.database }}
      owner: {{ .Values.keycloakx.database.username }}
      secret:
        name: {{ .Values.keycloakx.database.existingSecret }}
      encoding: UTF8
      localeProvider: icu
      icuLocale: en_US
      localeCType: en_US.UTF-8
      localeCollate: en_US.UTF-8
  storage:
    storageClass: {{ .Values.keycloakx.database.storageClass }}
    size: {{ .Values.keycloakx.database.size }}
  {{- with .Values.backup }}
  backup:
    {{- omit . "enabled" "schedule" "retentionPolicy" | toYaml | nindent 4 }}
  {{- end }}
